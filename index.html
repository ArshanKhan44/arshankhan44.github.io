<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Arshan Khan</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @font-face {
    font-family: 'Inter';
    src: local('Inter');
    font-weight: 400 700;
  }
  :root {
    --main: #2563EB;
    --text: #111827;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--main);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    margin: 0 0 12px 0;
    line-height: 1.2;
  }
  p.claim {
    font-size: clamp(16px, 2.4vw, 19px);
    font-weight: 400;
    color: #4B5563;
    margin: 0 0 32px 0;
    max-width: 480px;
    line-height: 1.5;
  }
  .status {
    font-size: 13px;
    color: #9CA3AF;
    border: 1px solid #E5E7EB;
    padding: 6px 14px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="mark">AK</div>
  <h1>Muhammad Arshan Khan</h1>
  <p class="claim">AI agents that know when to ask for help.</p>
  <div class="status">Portfolio in progress &mdash; case study coming soon</div>
</body>
</html>
