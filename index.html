<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Arshan Khan</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @font-face {
    font-family: 'Inter';
    src: local('Inter');
    font-weight: 400 700;
  }
  :root {
    --main: #2563EB;
    --text: #111827;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    text-align: center;
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--main);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1.2;
  }
  p.claim {
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight: 400;
    color: #4B5563;
    margin: 0 0 8px 0;
    max-width: 500px;
    line-height: 1.5;
  }
  p.positioning {
    font-size: 14px;
    color: #6B7280;
    margin: 0 0 28px 0;
    max-width: 480px;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .links a {
    text-decoration: none;
    color: var(--text);
    background: #fff;
    border: 1px solid #E5E7EB;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    border-color: var(--main);
    color: var(--main);
  }
  .status {
    font-size: 13px;
    color: #9CA3AF;
    border: 1px solid #E5E7EB;
    padding: 6px 14px;
    border-radius: 999px;
  }
</style>
</head>
<body>

  <p class="claim">AI agents that know when to ask for help.</p>

  </div>
  <div class="status">Case study &amp; capstone work coming soon</div>
</body>
</html>
